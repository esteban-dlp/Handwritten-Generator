[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-manuscrito"
version = "0.1.0"
description = "Local-first handwriting rendering and human-reviewed sample extraction for AI-assisted workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyMuPDF>=1.24", "WeasyPrint>=62"]

[project.scripts]
manuscrito = "manuscrito.cli:principal"

[tool.setuptools.packages.find]
where = ["src"]
